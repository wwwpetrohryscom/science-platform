name: Quality gates

# Two jobs, split by what they depend on.
#
# `checks` is deterministic: it reads the repository and nothing else, so
# it runs on every push and pull request and a failure always means the
# commit broke something.
#
# `external-sources` reaches the public internet, where a failure can
# mean a publisher had a bad afternoon. It runs on a schedule and on
# demand rather than on every commit, and it is deliberately narrow about
# what it treats as fatal: only a URL that is confirmed gone.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Weekly, Monday 06:00 UTC. Scientific web references rot on the
    # timescale of agency reorganisations, not of commits.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  checks:
    name: Content, structure and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Content rules
        run: npm run content:validate

      # The three editorial policy documents, in every language they
      # are advertised in. A policy page half in the reader's language
      # would undercut the claim the page is making, so a partial
      # translation is an error rather than a page.
      - name: Editorial policy translations
        run: npm run editorial:validate

      # The scientific data layer: dataset provenance, indicator
      # definitions, the ingested series, and the per-locale indicator
      # bodies. A dataset record with a hole in it is not provenance,
      # and an indicator without stated limitations is a page that has
      # left out the part it is most tempted to leave out.
      - name: Dataset and indicator rules
        run: npm run data:validate

      # Tool arithmetic, against known values and at the edges. A
      # calculator without numerical tests is not ready.
      - name: Scientific tool mathematics
        run: npm run tools:test

      # Reused prose. content:validate refuses two near-identical
      # bodies; this refuses a single sentence that was written once
      # and pasted twice, which the whole-body ratio cannot see.
      # Quotations are excluded — two articles quoting the same source
      # are following the sourcing standard, not copying each other.
      - name: Originality
        run: npm run content:originality

      # The fidelity rules first, then the corpus they judge. A rule
      # that has stopped firing looks exactly like a corpus with no
      # defects, so the rules carry their own injection tests.
      - name: Translation fidelity rules
        run: npm run content:translations:test

      - name: Translation fidelity
        run: npm run content:translations

      # Internal links, discussion references, and the check that every
      # cited URL is present in the evidence registry. A citation the
      # registry does not know about is the condition under which the
      # source-health report silently stops covering a source.
      - name: Internal links and evidence coverage
        run: npm run content:links

      - name: Evidence registry is current
        run: npm run evidence:check

      - name: Evidence registry rules and temporal qualifiers
        run: npm run evidence:validate

      - name: Entity graph is current
        run: npm run entities:check

      - name: Entity graph rules
        run: npm run entities:validate

      - name: Glossary rules
        run: npm run glossary:validate

      # Same reasoning as the translation rules: the linker's guards are
      # what stop it repeating the photovoltaic-cells bug, and a guard
      # that has stopped firing is invisible from the corpus alone.
      - name: Glossary linker guards
        run: npm run glossary:link:test

      # The internal-linking engine has the worst track record in the
      # repository: a wrong-sense cross-discipline link, and links
      # written into citation lists. Both are fixtures here.
      # Ranking behaviour, checked without a browser — the client
      # component and the index builder share one scoring module so
      # that these cases are the real thing.
      - name: Search ranking guards
        run: npm run search:test

      # Subtopic depth per locale. Reported, not enforced: the number is
      # a measure of how much of the corpus a reader can stay inside,
      # and it moves a wave at a time.
      - name: Localization depth
        run: npm run content:depth

      - name: Internal-linking guards
        run: npm run content:link:test

      - name: FAQ rules
        run: npm run faqs:validate

      # Coverage reached 100% of English scientific content in the
      # verification-and-localization-depth wave, so this is now a gate
      # rather than a report: a new English article ships with a ledger
      # entry or it does not ship. That is only a fair rule because the
      # backlog it would otherwise punish is gone.
      - name: Verification coverage
        run: npx tsx scripts/validate-verification.ts --require-full

      - name: Build
        run: npm run build

      # Build artefacts that pages reference: the default Open Graph
      # image and the per-locale RSS feeds. Both were named by every
      # page and produced by nothing until the rendered audit's
      # missing-asset rule was added; regenerating them here keeps the
      # check honest rather than passing on a stale file.
      - name: Open Graph image
        run: npm run og:generate

      - name: RSS feeds
        run: npm run feed:generate

      # The search index is a committed artefact the browser fetches,
      # so it is checked rather than regenerated: a change to the corpus
      # that did not rebuild the index should be visible as a failure,
      # not silently papered over by CI rebuilding it.
      - name: Search index is current
        run: npm run search:check

      - name: Sitemap
        run: npm run seo:validate

      # Reads the HTML the build just wrote, not the metadata objects
      # that were meant to produce it. This is the check that found
      # three legal pages canonicalising to `/en/%s`.
      - name: Rendered SEO audit
        run: npm run seo:audit

  external-sources:
    name: External source health
    runs-on: ubuntu-latest
    # A publisher outage should not block a merge queue.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # Resume from the previous run's results so a weekly check re-requests
      # only what has expired, rather than hitting every publisher every
      # time. The checker keeps a `dead` verdict for a fourteenth of the
      # normal TTL, so a source that comes back is rechecked quickly while
      # a healthy one is left alone.
      - name: Restore source-check cache
        uses: actions/cache/restore@v4
        with:
          path: .linkcache.json
          key: linkcache-${{ github.run_id }}
          restore-keys: |
            linkcache-

      # Fatal: confirmed 404/410, DNS failure, a citation absent from the
      # evidence registry, an unresolved internal link.
      # Not fatal: 401/403/405/412/429/503 and bot-challenge pages, which
      # mean the host refuses scripted clients rather than that the page
      # is gone. Failing on those would produce a wall of false alarms
      # from Wiley, Science, Nature, PNAS and a dozen others, and an
      # alarm nobody reads is worse than no alarm.
      - name: Check every cited URL
        run: npm run content:links:external

      - name: Save source-check cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .linkcache.json
          key: linkcache-${{ github.run_id }}
